AWSTemplateFormatVersion: '2010-09-09'
Resources:
  Code:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, IgnorePublicAcls: true, BlockPublicPolicy: true, RestrictPublicBuckets: true}
  CodeRead:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Code
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: ['s3:GetObject', 's3:GetObjectVersion']
            Resource: !Sub '${Code.Arn}/*'
            Condition: {StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}}
  LocalLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/aws/lambda/web/${AWS::StackName}.local', RetentionInDays: 1}
  Logs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/aws/lambda/web/${AWS::StackName}', RetentionInDays: 1}
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}
      Policies:
        - PolicyName: stream-demo-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['logs:CreateLogGroup', 'logs:CreateLogStream', 'logs:PutLogEvents']
                Resource: [!GetAtt Logs.Arn, !GetAtt LocalLogs.Arn]
Outputs:
  Bucket: {Value: !Ref Code}
  Role: {Value: !GetAtt Role.Arn}
